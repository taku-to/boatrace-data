name: Sync JSON
on:
  workflow_dispatch:
    inputs:
      date:
        description: '取得日（JST、YYYY-MM-DD）。空欄なら当日'
        required: false
        type: string
      mode:
        description: 'today: 当日 / recent: 当日・前日・前々日'
        required: true
        type: choice
        default: today
        options:
          - today
          - recent
permissions:
  contents: read
concurrency:
  group: boatrace-json
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sync_outcome: ${{ steps.fetch.outcome }}
      attempted_fetch: ${{ steps.fetch.outputs.attempted }}
    steps:
      - name: Check operating hours (JST)
        id: window
        shell: bash
        run: |
          jst_time=$(TZ=Asia/Tokyo date +%H%M)
          if (( 10#$jst_time >= 800 && 10#$jst_time < 2315 )); then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo '23:15-08:00 JST: skipping data collection and publication.'
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.allowed == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        if: steps.window.outputs.allowed == 'true'
        with:
          python-version: '3.12'
      - name: Test
        if: steps.window.outputs.allowed == 'true'
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate
        if: steps.window.outputs.allowed == 'true'
        id: fetch
        continue-on-error: true
        env:
          TARGET_DATE: ${{ inputs.date }}
          SYNC_MODE: ${{ inputs.mode }}
        run: |
          # Recheck after setup/tests in case they crossed 23:15 JST.
          jst_time=$(TZ=Asia/Tokyo date +%H%M)
          if (( 10#$jst_time < 800 || 10#$jst_time >= 2315 )); then
            echo 'Operating hours ended; skipping this fetch.'
            exit 0
          fi
          echo 'attempted=true' >> "$GITHUB_OUTPUT"
          if [ -n "$TARGET_DATE" ]; then
            python sync.py --date "$TARGET_DATE"
          elif [ "$SYNC_MODE" = 'recent' ]; then
            python sync.py --recent-days 3
          else
            python sync.py
          fi
      - name: Commit data and status
        if: steps.fetch.outputs.attempted == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v1
          if ! git diff --cached --quiet; then
            git commit -m 'Update BOATRACE JSON and sync status'
            git push origin HEAD
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.fetch.outputs.attempted == 'true' && vars.ENABLE_PAGES == 'true'
        with:
          path: docs
  deploy:
    needs: sync
    if: needs.sync.result == 'success' && needs.sync.outputs.attempted_fetch == 'true' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
  report:
    needs: [sync, deploy]
    if: always() && needs.sync.result != 'skipped' && (needs.sync.result != 'success' || needs.sync.outputs.attempted_fetch == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Report failure after preserving data and publishing status
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
          FETCH_RESULT: ${{ needs.sync.outputs.sync_outcome }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$SYNC_RESULT" != 'success' ] || [ "$FETCH_RESULT" != 'success' ] || [ "$DEPLOY_RESULT" = 'failure' ] || [ "$DEPLOY_RESULT" = 'cancelled' ]; then
            echo '取得または公開に失敗しました。ジョブログと docs/v1/status.json を確認してください。'
            exit 1
          fi

name: Schedule Probe

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 0-13 * * *'

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Show trigger and time
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "event=$EVENT_NAME"
          TZ=Asia/Tokyo date
